name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  htmlhint:
    name: HTMLHint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint HTML
        run: npx --yes htmlhint "**/*.html" --ignore "node_modules/**,_partials/**"

  link-check:
    name: Internal link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --base . './**/*.html'
          fail: true
